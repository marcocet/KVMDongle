# Installed as /etc/systemd/journald.conf.d/kvmdongle-volatile.conf
#
# Keeps the journal in /run (tmpfs/RAM) only -- never written to the SD
# card -- and caps how much RAM it can use, since the Zero W only has
# 512MB total. Logs are lost on reboot/power-loss, which is an acceptable
# trade for a device that gets unplugged without a clean shutdown; use
# `journalctl` while it's running if you need to debug something live.
[Journal]
Storage=volatile
RuntimeMaxUse=20M
