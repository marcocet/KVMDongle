# hostapd.conf -- Wi-Fi AP used only for uploading ISOs (see wifi-ap-toggle.sh).
# CHANGE ssid and wpa_passphrase before using this on anything but a bench.
interface=wlan0
driver=nl80211
ssid=KVMDongle
hw_mode=g
channel=6
wmm_enabled=0
auth_algs=1
ignore_broadcast_ssid=0
wpa=2
wpa_passphrase=changeme123
wpa_key_mgmt=WPA-PSK
wpa_pairwise=CCMP
rsn_pairwise=CCMP
